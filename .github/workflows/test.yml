name: test

# Runs the engine test suites. This is the only thing in the repository that
# enforces them - until now nothing ran them outside a developer's machine, so
# a broken suite could sit on main indefinitely.

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.engine }} (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        engine: [hono, express]
        # The declared floor from each template's package.json "engines" field.
        # Testing the minimum rather than whatever is newest is the point: it
        # catches "works on my machine" before a developer finds it.
        node: ["22"]

    defaults:
      run:
        working-directory: template/${{ matrix.engine }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # npm 11.x can fail with "Cannot read properties of null (reading 'edgesOut')"
      # when node_modules or the cache carries inconsistent state. Remove them
      # before install so every run is a cold install.
      - name: Clean install artifacts
        run: rm -rf node_modules package-lock.json

      - name: Clear npm cache
        run: npm cache clean --force 2>/dev/null || true

      # Deliberately `npm install`, not `npm ci`. No lockfile is tracked for the
      # templates - .gitignore excludes package-lock.json on the grounds that each
      # developer regenerates it with their own package manager - so there is
      # nothing for `npm ci` to verify against and it would fail immediately.
      # The cost is that this job resolves upstream versions fresh each run, so a
      # new upstream release can turn the job red without any change on this side.
      - name: Install
        run: npm install --no-audit --no-fund 2>&1 | tee npm-install.log

      - name: Typecheck
        run: npx tsc --noEmit

      # Not optional. `.env` is gitignored, so a clean checkout has none, and
      # src/env.ts validates against a Zod schema at import time - without it two
      # suites (queue, auth/me) die on a ZodError before a single assertion runs.
      # This is the same copy the scaffolder tells a new developer to do, and it
      # is verified green: 180/180.
      - name: Create .env from .env.example
        run: cp .env.example .env

      # Runs once and exits (unlike `npm test`, which is vitest in watch mode).
      #
      # The coverage floor is passed here rather than written into
      # vitest.config.ts, because that file is published inside the package: a
      # floor in it becomes every scaffolded project's floor, and it fails them on
      # their first run. A new project ships with only the auth module's tests -
      # the framework's own tests under src/framework/**/__tests__/ are not
      # published - which measures 8.49% statements against this 14% floor. Their
      # 56 tests all pass and the run is still red, for a number they did not
      # cause and cannot fix. This is a guard on this repository, so it lives
      # here.
      #
      # Set from express, which sits just below hono (21.24% vs 22.16%
      # statements) because it carries engine-specific files hono does not. Both
      # engines run, so a drop in either one fails.
      #
      # Raise these in the same change as the tests that earned the increase.
      - name: Test with coverage floor
        run: >-
          npm run test:run -- --coverage
          --coverage.thresholds.statements=30
          --coverage.thresholds.branches=23
          --coverage.thresholds.functions=27
          --coverage.thresholds.lines=30
